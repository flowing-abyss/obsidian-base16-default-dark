name: Publish new theme version

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # check:cascade / check:parity diff against the baseline-3.7.23
          # tag via `git show baseline-3.7.23:theme.css` - a shallow clone
          # (the default) would not fetch that tag and both would fail.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify theme.css matches sources and passes all gates
        run: |
          npm ci
          npm run check
          git diff --exit-code theme.css

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            manifest.json
            theme.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
