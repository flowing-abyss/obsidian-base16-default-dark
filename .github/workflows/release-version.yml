name: Publish new theme version

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify theme.css matches sources
        run: |
          npm ci
          npm run build
          git diff --exit-code theme.css

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            manifest.json
            theme.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
